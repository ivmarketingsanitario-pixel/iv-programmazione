name: Rinnova permesso Instagram
on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:
jobs:
  rinnova:
    runs-on: ubuntu-latest
    steps:
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | python3 -c "import json,sys;print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --repo "$REPO" --body "$NEW"
